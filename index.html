<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(3rem, 10vw, 6rem); margin: 0; letter-spacing: -0.04em; }

</head>
<body>
  <main>
    <h1>Hello 👋</h1>
    <p>Your website is running.</p>
  </main>

</html>
